{% set name = "mapcat" %}
{% set version = "0.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mapcat-{{ version }}.tar.gz
  sha256: f19df84f3cf0f3ef83d87ecdf761843152aaee752ebcebc611669d3d64a696d5

build:
  noarch: python
  entry_points:
    - actingest = mapcat.toolkit.act:main
    - mapcatmigrate = mapcat.helper:migrate
    - mapcatreset = mapcat.toolkit.reset:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - sqlmodel
    - sqlalchemy
    - aiosqlite
    - alembic
    - pydantic-settings
    - pixell
    - h5py
    - astropydantic

test:
  imports:
    - mapcat
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - actingest --help
    - mapcatmigrate --help
    - mapcatreset --help

about:
  home: https://pypi.org/project/mapcat/
  summary: The Depth-1 and Atomic MAP CATalog for the Simons Observatory.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - iparask
